site_name: "StarDS Manual"
site_description: "STAR (Simple Tensors Arrays and Rasters) — persistent N-dimensional arrays with compression and cloud storage."
repo_url: https://github.com/DOI-USGS/StarDS
edit_uri: ""

theme:
  name: material
  language: en
  custom_dir: overrides
  # Palette mirrors the Miniset docs: indigo/deep-orange in light, black/deep-orange
  # in dark, both following the OS preference by default.
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  site_name_style: bold
  title_style: light
  icon:
    annotation: material/chevron-right-circle
  highlightjs: true
  features:
    # Miniset's feature set, plus the navigation.path / indexes / sections that
    # the deeper StarDS nav (Guides, C++ API, CLI, Reference) relies on.
    - navigation.tabs
    - navigation.path
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

# Note: the 3D point-cloud hero (hero.js, ported from the Miniset docs) is an ES
# module loaded home-page-only from overrides/home.html — not listed here, so
# neither it nor the Three.js build it imports is pulled in on every page.

extra:
  generator: false

markdown_extensions:
  - abbr
  - footnotes
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

hooks:
  - docs_hooks.py
  - llms_txt_hook.py

plugins:
  - search
  - mkdoxy:
      projects:
        StarCPPAPI:
          src-dirs: ../StarDS/include/
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: 'stards.h'
            RECURSIVE: false
            EXTRACT_ALL: false
            HIDE_UNDOC_MEMBERS: true
            PREDEFINED: "ENABLE_ZLIB ENABLE_LZ4 ENABLE_CURL ENABLE_S3 ENABLE_ZSTD"
  - mkdocstrings:
      handlers:
        python:
          # Source tree (pure-Python wrappers) + the CMake build tree, which holds
          # the compiled `_pystards` extension the wrappers import at load time.
          # Listing the build dir here means a local `mkdocs serve` needs no
          # PYTHONPATH export — just build the bindings into ./build first.
          paths: [../bindings/python, ../build/bindings/python]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Concepts: getting-started/concepts.md
  - Guides:
      - Layers: guides/layers.md
      - Compression: guides/compression.md
      - Cloud Storage: guides/cloud-storage.md
      - Slicing: guides/slicing.md
      - Threading: guides/threading.md
  - Python API: python-api/index.md
  - "[ C++ API ]":
      - Overview: cpp-api/index.md
      - Classes: StarCPPAPI/classes.md
      - Class List: StarCPPAPI/annotated.md
      - Namespaces: StarCPPAPI/namespaces.md
      - Files: StarCPPAPI/files.md
  - CLI Tools:
      - stardsls: cli/stardsls.md
      - stards_translate: cli/stards-translate.md
  - Reference:
      - Format Spec: reference/format-spec.md
      - API Updates: reference/api-updates.md
  - "[ USGS Astrogeology Docs ]": https://astrogeology.usgs.gov/docs/
